name: Build Floating AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Install Android SDK 35 & Build Tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --console=plain || true
          ./gradlew assembleDebug --console=plain --rerun-tasks | grep -E "FAILURE:|Caused by:|Could not|Execution failed" -A 3 || exit 1
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: floating-soal-ai-apk
          path: app/build/outputs/apk/debug/app-debug.apk
